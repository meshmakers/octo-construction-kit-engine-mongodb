"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
attributes:
  - id: Name
    valueType: String
  - id: Alias
    valueType: String
    securitySensitive: true
  # AB#6334 (129): internal elements are only referenced by internal ones (Hint by Widget).
  - id: Hint
    valueType: String
    visibility: Internal
  - id: Code
    valueType: String
  - id: Secret
    valueType: String
    ownership: Secret
  - id: Mode
    valueType: Enum
    valueCkEnumId: ${this}/Mode
