"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
records:
  - recordId: Address
    derivable: Any
    attributes:
      - id: ${this}/Name
        name: Name
        isOptional: true
      - id: ${this}/Alias
        name: Alias
        isOptional: true
        access: ReadOnly
      - id: ${this}/Code
        name: Code
        isOptional: true
        access: MethodOnly
      - id: ${this}/Secret
        name: Secret
        isOptional: true
        access: Hidden
  # AB#6334: an internal record (Address is the value of a public method parameter, so it is public).
  - recordId: Memo
    visibility: Internal
    attributes:
      - id: ${this}/Name
        name: Name
        isOptional: true
