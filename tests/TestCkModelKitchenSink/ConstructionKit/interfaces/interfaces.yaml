"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
interfaces:
  - interfaceId: Named-1
    description: things with a name
    attributes:
      - id: ${this}/Name
        name: Name
      - id: ${this}/Alias
        name: Alias
        isOptional: true
  - interfaceId: Coded-1
    visibility: Internal
    attributes:
      - id: ${this}/Code
        name: Code
  # Phase 1 interface completion (F1.1-S5): extends, association and method members, deprecated.
  # AB#6334/AB#6335: internal — it uses the internal role Link and declares an internal method.
  - interfaceId: Labeled-1
    visibility: Internal
    extends:
      - ${this}/Named-1
    attributes:
      - id: ${this}/Code
        name: Code
        isOptional: true
    associations:
      - id: ${this}/Link
        targetCkInterfaceId: ${this}/Named-1
        multiplicity: N
        isOptional: true
    methods:
      - methodId: Relabel-1
        visibility: Internal
  - interfaceId: Legacy-1
    visibility: Internal
    deprecated: true
    extends:
      - ${this}/Labeled-1
    methods:
      - methodId: Tag-1
        kind: Static
