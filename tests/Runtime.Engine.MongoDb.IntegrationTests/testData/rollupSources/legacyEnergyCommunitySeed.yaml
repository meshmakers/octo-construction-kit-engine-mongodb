$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
# AB#5157 seed-compatibility fixture: the RollupArchive entities of the shipped
# EnergyCommunity.Base blueprint seed (energy-community/src/blueprints/EnergyCommunity.Base/
# seed-data/entities.yaml, the RollupArchive block) copied VERBATIM. Every one of them declares
# its source through the deprecated RollupArchive.SourceArchiveRtId scalar - the old form that
# System.StreamData 1.8.0 must keep importing and normalising into a single unbounded source.
#
# Trimmed to the RollupArchive entities: the raw archive (ec...a01), the legacy TimeRangeArchive
# (ec...a11) and every non-stream-data entity of the seed are omitted, so the fixture needs the
# System.StreamData model alone. SourceArchiveRtId is a plain string attribute, not an
# association, so the referenced sources need not exist for the import or the normalisation.
dependencies:
  - System.StreamData-[1.8,2.0)
entities:
- rtId: ec0000000000000000000a02
  ckTypeId: System.StreamData/RollupArchive-1
  rtWellKnownName: energy-measurements-hourly
  associations: []
  attributes:
  - id: System.StreamData/RollupArchive.SourceArchiveRtId-1
    value: 'ec0000000000000000000a01'
  - id: System.StreamData/RollupArchive.BucketSizeMs-1
    value: 3600000
  - id: System.StreamData/RollupArchive.WatermarkLagMs-1
    value: 900000
  - id: System.StreamData/RollupArchive.BucketAlignment-1
    value: 0
  - id: System.StreamData/RollupArchive.Aggregations-1
    value:
    - ckRecordId: System.StreamData/CkRollupAggregation-1
      attributes:
      - id: System.StreamData/CkRollupAggregation.SourcePath-1
        value: Amount.Value
      - id: System.StreamData/CkRollupAggregation.Function-1
        value: 3
    - ckRecordId: System.StreamData/CkRollupAggregation-1
      attributes:
      - id: System.StreamData/CkRollupAggregation.SourcePath-1
        value: DataQuality
      - id: System.StreamData/CkRollupAggregation.Function-1
        value: 2
  - id: System.StreamData/Archive.TargetCkTypeId-1
    value: Basic.Energy/EnergyMeasurement
  - id: System.StreamData/Archive.Columns-1
    value:
    - ckRecordId: System.StreamData/CkArchiveColumn-1
      attributes:
      - id: System.StreamData/CkArchiveColumn.Path-1
        value: amountvalue_sum
      - id: System.StreamData/CkArchiveColumn.Required-1
        value: false
      - id: System.StreamData/CkArchiveColumn.Indexed-1
        value: true
    - ckRecordId: System.StreamData/CkArchiveColumn-1
      attributes:
      - id: System.StreamData/CkArchiveColumn.Path-1
        value: dataquality_max
      - id: System.StreamData/CkArchiveColumn.Required-1
        value: false
      - id: System.StreamData/CkArchiveColumn.Indexed-1
        value: true
  - id: System.StreamData/Archive.Status-1
    value: 2

# Daily rollup CHAINED on hourly (cascade keeps open-bucket recompute cheap).
# CalendarDay (1) + Europe/Vienna: buckets snap to local Austrian midnight,
# DST-correct (requires System.StreamData >= 1.6.4). Reads the hourly PHYSICAL
# columns and re-aggregates SUM-of-sums / MAX-of-maxes; TargetColumnName keeps
# the stored column names identical so query shapes match all levels.
# BucketSizeMs 86400000 is informational under calendar alignment.
- rtId: ec0000000000000000000a03
  ckTypeId: System.StreamData/RollupArchive-1
  rtWellKnownName: energy-measurements-daily
  associations: []
  attributes:
  - id: System.StreamData/RollupArchive.SourceArchiveRtId-1
    value: 'ec0000000000000000000a02'
  - id: System.StreamData/RollupArchive.BucketSizeMs-1
    value: 86400000
  - id: System.StreamData/RollupArchive.WatermarkLagMs-1
    value: 900000
  - id: System.StreamData/RollupArchive.BucketAlignment-1
    value: 1
  - id: System.StreamData/RollupArchive.ReferenceTimeZone-1
    value: Europe/Vienna
  - id: System.StreamData/RollupArchive.Aggregations-1
    value:
    - ckRecordId: System.StreamData/CkRollupAggregation-1
      attributes:
      - id: System.StreamData/CkRollupAggregation.SourcePath-1
        value: amountvalue_sum
      - id: System.StreamData/CkRollupAggregation.Function-1
        value: 3
      - id: System.StreamData/CkRollupAggregation.TargetColumnName-1
        value: amountvalue_sum
    - ckRecordId: System.StreamData/CkRollupAggregation-1
      attributes:
      - id: System.StreamData/CkRollupAggregation.SourcePath-1
        value: dataquality_max
      - id: System.StreamData/CkRollupAggregation.Function-1
        value: 2
      - id: System.StreamData/CkRollupAggregation.TargetColumnName-1
        value: dataquality_max
  - id: System.StreamData/Archive.TargetCkTypeId-1
    value: Basic.Energy/EnergyMeasurement
  - id: System.StreamData/Archive.Columns-1
    value:
    - ckRecordId: System.StreamData/CkArchiveColumn-1
      attributes:
      - id: System.StreamData/CkArchiveColumn.Path-1
        value: amountvalue_sum
      - id: System.StreamData/CkArchiveColumn.Required-1
        value: false
      - id: System.StreamData/CkArchiveColumn.Indexed-1
        value: true
    - ckRecordId: System.StreamData/CkArchiveColumn-1
      attributes:
      - id: System.StreamData/CkArchiveColumn.Path-1
        value: dataquality_max
      - id: System.StreamData/CkArchiveColumn.Required-1
        value: false
      - id: System.StreamData/CkArchiveColumn.Indexed-1
        value: true
  - id: System.StreamData/Archive.Status-1
    value: 2

# Weekly rollup CHAINED on daily — an ISO week is 7 whole Vienna calendar
# days, so SUM-of-sums / MAX-of-maxes over daily is exact. Leaf of the ladder
# (nothing chains on weekly; weeks do not tile months). Iso8601Week (2) +
# Europe/Vienna: buckets snap to Monday 00:00 local time.
- rtId: ec0000000000000000000a04
  ckTypeId: System.StreamData/RollupArchive-1
  rtWellKnownName: energy-measurements-weekly
  associations: []
  attributes:
  - id: System.StreamData/RollupArchive.SourceArchiveRtId-1
    value: 'ec0000000000000000000a03'
  - id: System.StreamData/RollupArchive.BucketSizeMs-1
    value: 604800000
  - id: System.StreamData/RollupArchive.WatermarkLagMs-1
    value: 900000
  - id: System.StreamData/RollupArchive.BucketAlignment-1
    value: 2
  - id: System.StreamData/RollupArchive.ReferenceTimeZone-1
    value: Europe/Vienna
  - id: System.StreamData/RollupArchive.Aggregations-1
    value:
    - ckRecordId: System.StreamData/CkRollupAggregation-1
      attributes:
      - id: System.StreamData/CkRollupAggregation.SourcePath-1
        value: amountvalue_sum
      - id: System.StreamData/CkRollupAggregation.Function-1
        value: 3
      - id: System.StreamData/CkRollupAggregation.TargetColumnName-1
        value: amountvalue_sum
    - ckRecordId: System.StreamData/CkRollupAggregation-1
      attributes:
      - id: System.StreamData/CkRollupAggregation.SourcePath-1
        value: dataquality_max
      - id: System.StreamData/CkRollupAggregation.Function-1
        value: 2
      - id: System.StreamData/CkRollupAggregation.TargetColumnName-1
        value: dataquality_max
  - id: System.StreamData/Archive.TargetCkTypeId-1
    value: Basic.Energy/EnergyMeasurement
  - id: System.StreamData/Archive.Columns-1
    value:
    - ckRecordId: System.StreamData/CkArchiveColumn-1
      attributes:
      - id: System.StreamData/CkArchiveColumn.Path-1
        value: amountvalue_sum
      - id: System.StreamData/CkArchiveColumn.Required-1
        value: false
      - id: System.StreamData/CkArchiveColumn.Indexed-1
        value: true
    - ckRecordId: System.StreamData/CkArchiveColumn-1
      attributes:
      - id: System.StreamData/CkArchiveColumn.Path-1
        value: dataquality_max
      - id: System.StreamData/CkArchiveColumn.Required-1
        value: false
      - id: System.StreamData/CkArchiveColumn.Indexed-1
        value: true
  - id: System.StreamData/Archive.Status-1
    value: 2

