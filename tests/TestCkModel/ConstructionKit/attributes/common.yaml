"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
attributes:
  - id: Name
    description: Designation of an entity.
    valueType: String
  - id: Tags
    valueType: StringArray
    description: Tags of an entity.
  - id: Binary
    valueType: BinaryLinked
  - id: DataCount
    valueType: Int
    # isRuntimeState round-trip coverage (AB#4589): verifies the flag survives the
    # CkAttributeDto -> Mongo CkAttribute -> CkAttributeDto persistence cycle and
    # reaches the runtime CK cache. Asserted by CkAttributeRuntimeStatePersistenceTests.
    isRuntimeState: true