"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
# AB#5533 SECRET value type coverage (concept docs/concept-secret-attribute-type.md in the engine):
# a type attribute and a record sub-attribute of value type Secret. Asserted by
# SecretAttributeStorageTests (raw-BSON shape, legacy reads, IS_NULL / IS_NOT_NULL filters,
# refused operators, index guard) and CkRecordKeyPersistenceTests (recordKey round-trip).
attributes:
  - id: SecretHolder.ApiKey
    description: A credential stored as a protected envelope.
    valueType: Secret
  - id: SecretHolder.CredentialKey
    description: Record key of a credential entry.
    valueType: String
  - id: SecretHolder.CredentialValue
    description: Secret value of a credential entry.
    valueType: Secret
  - id: SecretHolder.Credentials
    description: Keyed credential entries with a Secret sub-attribute.
    valueType: RecordArray
    valueCkRecordId: ${this}/CredentialEntry
  - id: SecretHolder.PrimaryCredential
    description: A single credential entry with a Secret sub-attribute.
    valueType: Record
    valueCkRecordId: ${this}/CredentialEntry
