"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
# AB#5533: a record with a Secret sub-attribute must declare a recordKey (compiler message 76).
# The key must round-trip through the MongoDB CK record document (CkRecordKeyPersistenceTests).
records:
  - recordId: CredentialEntry
    recordKey: Key
    attributes:
      - id: ${this}/SecretHolder.CredentialKey
        name: Key
      - id: ${this}/SecretHolder.CredentialValue
        name: Value
        isOptional: true
