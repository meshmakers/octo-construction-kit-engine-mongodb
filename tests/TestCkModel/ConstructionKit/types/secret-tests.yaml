"$schema": "https://schemas.meshmakers.cloud/construction-kit-elements.schema.json"
# AB#5533 SECRET value type storage coverage (SecretAttributeStorageTests).
types:
  - typeId: SecretHolder
    description: Collection root carrying Secret attributes at the top level and inside records.
    derivedFromCkTypeId: ${System}/Entity
    attributes:
    - id: ${this}/Name
      name: Name
      isOptional: true
    - id: ${this}/SecretHolder.ApiKey
      name: ApiKey
      isOptional: true
    - id: ${this}/SecretHolder.Credentials
      name: Credentials
      isOptional: true
    - id: ${this}/SecretHolder.PrimaryCredential
      name: PrimaryCredential
      isOptional: true
  - typeId: SecretHolderVariant
    description: >-
      AB#5533 derived type without attributes of its own. Its entities are stored in the collection of
      its collection root (SecretHolder), not in a collection named after the type - like every
      System.Communication/*Configuration in RtEntity_SystemConfiguration.
    derivedFromCkTypeId: ${this}/SecretHolder
