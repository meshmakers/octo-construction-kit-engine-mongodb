# Root-level CI pipeline using shared templates from octo-pipeline-templates.
#
# Phase 1 pilot 4 of the YAML migration (see octo-mesh-deployment's
# docs/pipeline-architecture-concept.md). After DEH / CK-Engine / SDK,
# this is one of the two remaining Libs in tier 2-3. No Docker, no Helm —
# pure NuGet lib that consumes the upstream CK-Engine CI's main builds via
# resources.pipelines.
#
# The build args don't reference $(OctoPublishCatalog), so the
# effectivePublishCatalog conditional block from the SDK/CK-Engine variants
# is not needed here.

name: $(MajorVersion).$(MinorVersion).$(date:yyMM).$(DayOfMonth)$(rev:rrr)-$(Build.SourceBranchName)

parameters:
  # Injected by the release train on r-tag builds so the whole chain pins the
  # scheduler-determined lib/comm release version (forwarded to
  # update-build-number.yml). Default 'auto' = no override (version computed
  # normally); the train injects the real version on r-tag.
  - name: octoCoreLibVersion
    type: string
    default: 'auto'
  - name: octoCommVersion
    type: string
    default: 'auto'

resources:
  # Chain link: exactly ONE upstream pipeline resource per repo. Pipeline
  # resource triggers do NOT batch, so a repo with two trigger parents is
  # started twice per main cascade. The chain is therefore a single-parent
  # tree; artificial ordering edges (marked below) resolve real DAG joins.
  # Full picture: octo-mesh-deployment/pipelines/orchestrator-ci.yml.
  # Ordering edge: CK-Mongo only needs CK-Engine, but running it behind
  # octo-sdk keeps octo-common-services (needs BOTH) single-parent.
  pipelines:
    - pipeline: octo-sdk
      source: octo-sdk-CI
      trigger:
        branches:
          include:
            - main
  repositories:
    - repository: pipelineTemplates
      type: github
      name: meshmakers/octo-pipeline-templates
      endpoint: meshmakers-access-token
      ref: refs/tags/tpl-v0.6.7

trigger:
  batch: true
  branches:
    include:
      - dev/*
      - test/*
      - main
  # Docs-only commits must not start CI (AB#5719). Excluded paths are
  # never consumed by the build; a root README.md change reaches the
  # packed NuGet readme with the next code commit.
  paths:
    exclude:
      - '**/*.md'
      - '*.md'
      - '.claude/'
      - 'docs/'
  tags:
    exclude:
      - '*'

variables:
  - group: ApiKeys-mm-cloud
  - group: OctoDefault
  - name: solutionFile
    value: 'Octo.ConstructionKit.Engine.MongoDb.sln'
  - name: buildConfiguration
    value: 'Release'
  - name: buildPlatform
    value: 'Any CPU'
  - name: isRelease
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/tags/r') }}
  - name: isMain
    value: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/main') }}
  - name: isTest
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/heads/test') }}

stages:
  - stage: Build
    jobs:
      - job: buildAndTest
        displayName: 'Build nuget and execute tests'
        # Explicit job budget (AB#6292). The Test step has its own, clearly smaller
        # timeout below, so a stuck or failing test run ends the job with a red Test
        # step and its logs instead of an anonymous job-timeout cancellation.
        timeoutInMinutes: 70
        pool:
          name: meshmakers-ci-agents
        steps:
          - template: templates/steps/update-build-number.yml@pipelineTemplates
            parameters:
              octoCoreLibVersionOverride: ${{ replace(parameters.octoCoreLibVersion, 'auto', '') }}
              octoCommVersionOverride: ${{ replace(parameters.octoCommVersion, 'auto', '') }}
          - checkout: self
            clean: true
            submodules: true
          - template: templates/steps/set-version.yml@pipelineTemplates
          # §10 #7 Versions-Floor-Check pilot. CK-Mongo is the repo that hit
          # the r3.4.9 slim-NuGet-restore trap (build #34814) which inspired
          # this guard. With OctoCoreLibVersion split done at 3.4.x, declare
          # the floor here so any future Directory.Build.props edit that
          # accidentally rolls back to 3.3.* fails the build before restore.
          #
          # commFloor is deliberately NOT declared: this repo references no
          # communication package (no .csproj consumes OctoCommVersion), so
          # the OctoCommVersion pin in Directory.Build.props is inert. On an
          # r-tag build the train injects only octoCoreLibVersion, leaving
          # OctoCommVersion to the props fallback '$(OctoVersion)' — a macro
          # verify-libs-floor extracts literally and can't compare, which
          # hard-failed the auto-train cascade on r3.4.31 (build #38044).
          # Gating a floor on a version the build never restores is a false
          # positive; the core-lib floor is the only relevant guard here.
          # test/0.2-dev line: this branch builds against the 0.2.* channel
          # (update-build-number resolves OctoCoreLibVersion from the branch
          # name), so the floor is 0.2 here. Restore '3.4' when merging to a
          # 3.4-line branch — a lower floor weakens the guard there.
          - template: templates/steps/verify-libs-floor.yml@pipelineTemplates
            parameters:
              coreLibFloor: '0.2'
          # Fresh package list for the private feed only; nuget.org stays cached.
          # Replaces restore --force and noCache (AB#5720).
          - template: templates/steps/purge-private-nuget-http-cache.yml@pipelineTemplates
          - task: DotNetCoreCLI@2
            retryCountOnTaskFailure: 2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'
              projects: '$(SolutionFile)'
              restoreArguments: '/p:OctoNugetPrivateServer=$(nugetPrivateServer)'
          - task: DotNetCoreCLI@2
            retryCountOnTaskFailure: 2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: $(SolutionFile)
              arguments: '--configuration $(BuildConfiguration) --no-restore /p:OctoNugetPrivateServer=$(nugetPrivateServer) /p:OctoPrivateGitHubApiKey=$(GitHubPAT) /p:OctoPublicGitHubApiKey=$(GitHubPAT)'
          # Test fails fast (AB#6292):
          #  - NO retryCountOnTaskFailure: a whole-step retry reran the full integration
          #    suite (~10-30 min per pass) up to 3 times for one deterministic red test,
          #    which pushed 51009 / 51014 into the 60-min job timeout, and it hid a mass
          #    failure (50546: 109 failed, green on the retry). Flaky tests are handled
          #    per test, never per step. Restore and Build keep their retries (network /
          #    feed hiccups).
          #  - timeoutInMinutes 50 < job 70: one green pass takes 5-38 min depending on
          #    agent load (50769: 5 min on a burst agent, 50755: 38 min on a loaded one;
          #    pve02 CPU steal, Epic AB#5711). A red test no longer waits for this limit -
          #    the step ends after one pass; the limit only catches a hung run.
          #  - --blame-hang-timeout 15m: a single test that runs longer than 15 min (the
          #    slowest single test so far: 210 s on a heavily loaded agent, build 50546)
          #    aborts the test host and names the hanging test in the log. No dump
          #    (dump type none) - a full dump of the test host is GBs and not needed.
          - task: DotNetCoreCLI@2
            displayName: 'Test'
            timeoutInMinutes: 50
            inputs:
              command: 'test'
              arguments: '--configuration $(buildConfiguration) --no-build /p:OctoNugetPrivateServer=$(nugetPrivateServer) --blame-hang --blame-hang-timeout 15m --blame-hang-dump-type none'
              projects: |
                **/*Tests.csproj
              testRunTitle: 'CI'
          - template: templates/steps/handle-artifacts.yml@pipelineTemplates
          - template: templates/steps/push-nuget-package.yml@pipelineTemplates
